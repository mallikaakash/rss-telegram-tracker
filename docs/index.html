<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Library</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f3ead6; --panel:#fbf6ea; --border:#cdb98c; --border-strong:#a8905f;
  --text:#241c10; --muted:#7a6a4c; --accent:#9c3b1a; --link:#7a3315;
  --must-bg:#9c3b1a; --must-fg:#f6ecd9;
  --skim-bg:#9c7a1f; --skim-fg:#231a06;
  --low-bg:#6b6b4c; --low-fg:#f0ead9;
  --gem-bg:#3c5c3a; --gem-fg:#f0ead9;
  --font-serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  --font-mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#191309; --panel:#211a10; --border:#4a3c26; --border-strong:#6b5636;
    --text:#e9dfc4; --muted:#a3906c; --accent:#d4763f; --link:#e08a52;
    --must-bg:#7a2c12; --must-fg:#f6ecd9;
    --skim-bg:#7a5f16; --skim-fg:#f6ecd9;
    --low-bg:#4a4a36; --low-fg:#d9d2ba;
    --gem-bg:#2e4a2c; --gem-fg:#e9dfc4;
  }
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font-serif);background:var(--bg);color:var(--text);
 max-width:720px;margin:0 auto;padding:28px 18px 70px;line-height:1.6}
a{color:var(--link)}
h1{font-family:var(--font-mono);font-size:1.05rem;font-weight:700;
 letter-spacing:.02em;text-transform:uppercase;margin-bottom:6px}
.meta{font-family:var(--font-mono);color:var(--muted);font-size:.72rem;
 margin-bottom:22px;text-transform:uppercase;letter-spacing:.04em;
 border-bottom:1px solid var(--border);padding-bottom:12px}
.meta a{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--border);
 box-shadow:3px 3px 0 0 var(--border);padding:16px 18px;margin:0 0 18px}
.badge{display:inline-block;font-family:var(--font-mono);font-size:.68rem;
 font-weight:700;letter-spacing:.06em;text-transform:uppercase;
 padding:2px 7px;border:1px solid rgba(0,0,0,.15);margin-bottom:9px}
.badge.must{background:var(--must-bg);color:var(--must-fg)}
.badge.skim{background:var(--skim-bg);color:var(--skim-fg)}
.badge.low{background:var(--low-bg);color:var(--low-fg)}
.badge.gem{background:var(--gem-bg);color:var(--gem-fg)}
.src{font-family:var(--font-mono);color:var(--muted);font-size:.72rem;
 margin-left:8px;text-transform:uppercase;letter-spacing:.03em}
.card h2{font-size:1.08rem;line-height:1.4;margin:2px 0 8px;font-weight:700}
.card h2 a{text-decoration:none;color:var(--text)}
.card h2 a:hover{color:var(--accent)}
.why{color:var(--muted);font-size:.88rem;font-style:italic;margin-bottom:9px;
 border-left:2px solid var(--border);padding-left:10px}
ul{padding-left:20px}
li{font-size:.92rem;margin-bottom:5px}
.section{margin:30px 0 12px;font-family:var(--font-mono);font-size:.74rem;
 font-weight:700;color:var(--muted);text-transform:uppercase;
 letter-spacing:.08em;border-bottom:1px solid var(--border);padding-bottom:6px}
.stamp{font-family:var(--font-mono);color:var(--muted);font-size:.7rem;
 float:right;text-transform:uppercase}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar input[type=text],.toolbar input[type=email]{
 font-family:var(--font-mono);font-size:.85rem;background:var(--panel);
 color:var(--text);border:1px solid var(--border);padding:8px 10px;flex:1;min-width:160px}
.toolbar input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.chip,.mark,button.plain{font-family:var(--font-mono);font-size:.7rem;text-transform:uppercase;
 letter-spacing:.04em;background:var(--panel);color:var(--muted);
 border:1px solid var(--border);padding:7px 11px;cursor:pointer}
.chip.active,.mark.on{background:var(--accent);color:var(--must-fg);border-color:var(--accent)}
.marks{display:flex;gap:6px;margin-top:12px}
.mark{padding:5px 8px}
.empty{color:var(--muted);font-size:.9rem;font-style:italic;padding:20px 0}
.auth{background:var(--panel);border:1px solid var(--border);padding:12px 14px;margin-bottom:18px}
.auth p{font-size:.88rem;margin:0 0 8px}
.note{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);margin-top:8px}
#more{margin-top:8px}
</style>
</head>
<body>
<h1>The Library</h1>
<div class="meta" id="meta">loading &middot; <a href="runs.html">rss runs</a> &middot; <a href="discovery/runs.html">discovery runs</a></div>
<div class="auth" id="auth"></div>
<div class="toolbar"><input type="text" id="q" placeholder="search title or source..."></div>
<div class="toolbar" id="pipelines"></div>
<div class="toolbar" id="tiers"></div>
<div class="toolbar" id="statuses"></div>
<div id="list"></div>
<p class="empty" id="empty" hidden>No matches.</p>
<button class="plain" id="more" hidden>Show more</button>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const READER_EMAIL = "mallik.aakash777@gmail.com";
const supabase = createClient(
  "https://pzvtstgwvcgwpuqxtibv.supabase.co",
  "sb_publishable_InIfcKlWwe5F0hXxuZ8uJQ_w00574mL"
);

const TIERS = {
  must_read: ["Must read", "must"],
  worth_a_skim: ["Worth a skim", "skim"],
  low_priority: ["Low priority", "low"],
  hidden_gem: ["Hidden gem", "gem"],
  solid_find: ["Solid find", "skim"],
  skip: ["Skip", "low"],
};
const MARKS = [
  ["imp", "Important"],
  ["read", "Read"],
  ["ignore", "Ignore"],
];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

const state = {
  rows: [],
  pipeline: new URLSearchParams(location.search).get("pipeline") || "all",
  tier: "all",
  status: "inbox",
  q: "",
  shown: 40,
  session: null,
  busy: null,
  loaded: false,
};

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function dayLabel(iso) {
  if (!iso) return "Undated";
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  return `${DAYS[dt.getUTCDay()]} ${d} ${MONTHS[m - 1]} ${y}`;
}
function matches(row) {
  if (state.pipeline !== "all" && row.pipeline !== state.pipeline) return false;
  if (state.tier !== "all" && row.tier !== state.tier) return false;
  const mark = row.reading_status || "";
  if (state.status === "inbox" && (mark === "ignore" || mark === "read")) return false;
  if (state.status === "imp" && mark !== "imp") return false;
  if (state.status === "read" && mark !== "read") return false;
  if (state.status === "ignore" && mark !== "ignore") return false;
  if (state.status === "unmarked" && mark) return false;
  if (state.q) {
    const hay = `${row.title || ""} ${row.source_name || ""}`.toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}
function chips(el, items, key) {
  el.innerHTML = items.map(([id, label]) =>
    `<button class="chip${state[key] === id ? " active" : ""}" data-key="${key}" data-id="${id}">${label}</button>`
  ).join("");
}
function renderAuth() {
  const box = document.getElementById("auth");
  const session = state.session;
  if (session) {
    const email = session.user.email || "";
    const ok = email.toLowerCase() === READER_EMAIL;
    box.innerHTML = `<p>Signed in as ${esc(email)}.${ok ? "" : " This account cannot change marks."}</p>
      <button class="plain" id="signout" type="button">Sign out</button>`;
    document.getElementById("signout").onclick = () => supabase.auth.signOut();
    return;
  }
  box.innerHTML = `<p>Sign in to mark a piece important, read, or ignored.</p>
    <form class="toolbar" id="login">
      <input type="email" id="email" required value="${esc(READER_EMAIL)}">
      <button class="plain" type="submit">Send link</button>
    </form>
    <form class="toolbar" id="confirm">
      <input type="text" id="token" inputmode="numeric" placeholder="code from the email">
      <button class="plain" type="submit">Confirm code</button>
    </form>
    <p class="note" id="authnote"></p>`;
  document.getElementById("login").onsubmit = async (ev) => {
    ev.preventDefault();
    const email = document.getElementById("email").value.trim();
    const note = document.getElementById("authnote");
    note.textContent = "Sending…";
    const { error } = await supabase.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: location.href.split("#")[0] },
    });
    note.textContent = error ? error.message : "Check that inbox for a link or a code.";
  };
  document.getElementById("confirm").onsubmit = async (ev) => {
    ev.preventDefault();
    const email = document.getElementById("email").value.trim();
    const token = document.getElementById("token").value.trim();
    const note = document.getElementById("authnote");
    const { error } = await supabase.auth.verifyOtp({ email, token, type: "email" });
    note.textContent = error ? error.message : "";
  };
}
function render() {
  const filtered = state.rows.filter(matches);
  const slice = filtered.slice(0, state.shown);
  const signedIn = !!state.session;
  let html = "";
  let lastDay = null;
  for (const row of slice) {
    const day = row.seen_on || "";
    if (day !== lastDay) {
      html += `<div class="section">${esc(dayLabel(day))}</div>`;
      lastDay = day;
    }
    const [label, cls] = TIERS[row.tier] || [row.tier, "low"];
    const pts = (row.points || []).map(p => `<li>${esc(p)}</li>`).join("");
    const why = row.why ? `<div class="why">${esc(row.why)}</div>` : "";
    const marks = MARKS.map(([id, name]) => {
      const on = row.reading_status === id ? " on" : "";
      return `<button class="mark${on}" type="button" data-id="${esc(row.id)}" data-pipeline="${esc(row.pipeline)}" data-mark="${id}" ${signedIn ? "" : "disabled"}>${name}</button>`;
    }).join("");
    html += `<article class="card">
      <span class="badge ${cls}">${esc(label)}</span>
      <span class="src">${esc(row.source_name || row.pipeline)}</span>
      <h2><a href="${esc(row.url || "#")}">${esc(row.title || row.url || "Untitled")}</a></h2>
      ${why}${pts ? `<ul>${pts}</ul>` : ""}
      <div class="marks">${marks}</div>
    </article>`;
  }
  document.getElementById("list").innerHTML = html;
  document.getElementById("empty").hidden = !state.loaded || filtered.length !== 0;
  const more = document.getElementById("more");
  more.hidden = state.shown >= filtered.length;
  document.getElementById("meta").innerHTML =
    `${filtered.length} shown &middot; grouped by the day they were indexed &middot; <a href="runs.html">rss runs</a> &middot; <a href="discovery/runs.html">discovery runs</a>`;
  chips(document.getElementById("pipelines"), [["all","All"],["rss","RSS"],["discovery","Discovery"]], "pipeline");
  chips(document.getElementById("tiers"), [["all","All tiers"], ...Object.entries(TIERS).map(([id, v]) => [id, v[0]])], "tier");
  chips(document.getElementById("statuses"), [
    ["inbox","Inbox"], ["imp","Important"], ["read","Read"], ["ignore","Ignored"], ["unmarked","Unmarked"], ["all","All marks"]
  ], "status");
}
async function load() {
  const page = 1000;
  let from = 0;
  const rows = [];
  while (true) {
    const { data, error } = await supabase.from("findings")
      .select("id,pipeline,tier,title,url,source_name,seen_on,why,points,reading_status")
      .not("tier", "in", "(bootstrap,reject)")
      .order("seen_on", { ascending: false, nullsFirst: false })
      .order("id", { ascending: true })
      .range(from, from + page - 1);
    if (error) {
      document.getElementById("meta").textContent = error.message;
      return;
    }
    rows.push(...data);
    if (data.length < page) break;
    from += page;
  }
  state.rows = rows;
  state.loaded = true;
  render();
}
document.getElementById("q").addEventListener("input", (ev) => {
  state.q = ev.target.value.trim().toLowerCase();
  state.shown = 40;
  render();
});
document.body.addEventListener("click", async (ev) => {
  const chip = ev.target.closest(".chip");
  if (chip) {
    state[chip.dataset.key] = chip.dataset.id;
    state.shown = 40;
    if (chip.dataset.key === "pipeline") {
      const url = new URL(location.href);
      if (state.pipeline === "all") url.searchParams.delete("pipeline");
      else url.searchParams.set("pipeline", state.pipeline);
      history.replaceState(null, "", url);
    }
    render();
    return;
  }
  const mark = ev.target.closest(".mark");
  if (!mark || !state.session) return;
  const id = mark.dataset.id;
  const pipeline = mark.dataset.pipeline;
  const next = mark.dataset.mark;
  const row = state.rows.find(r => r.id === id && r.pipeline === pipeline);
  if (!row || state.busy === id + pipeline) return;
  const value = row.reading_status === next ? null : next;
  state.busy = id + pipeline;
  const { error } = await supabase.from("findings").update({ reading_status: value })
    .eq("id", id).eq("pipeline", pipeline);
  state.busy = null;
  if (error) {
    document.getElementById("meta").textContent = error.message;
    return;
  }
  row.reading_status = value;
  render();
});
document.getElementById("more").onclick = () => {
  state.shown += 40;
  render();
};
const { data } = await supabase.auth.getSession();
state.session = data.session;
renderAuth();
supabase.auth.onAuthStateChange((_event, session) => {
  state.session = session;
  renderAuth();
  render();
});
load();
</script>
</body>
</html>
