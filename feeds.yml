# Indexes with no public feed. First run marks whatever is on the page as seen.
pages:
  - name: Anthropic Engineering
    mode: html
    url: https://www.anthropic.com/engineering
    link_prefix: /engineering/
  - name: Prime Intellect
    mode: html
    url: https://www.primeintellect.ai/blog
    link_prefix: /blog/
  - name: Cursor
    mode: html
    url: https://cursor.com/blog
    link_prefix: /blog/
    deny_contains:
      - /blog/topic
  - name: Notion
    mode: html
    url: https://www.notion.com/blog
    link_prefix: /blog/
    deny_contains:
      - /blog/topic
  - name: LinkedIn Engineering
    mode: html
    url: https://www.linkedin.com/blog/engineering
    link_prefix: /blog/engineering/
    extra_segments: 2
  - name: Uber Engineering
    mode: firecrawl
    url: https://www.uber.com/us/en/blog/engineering/
  - name: Meta AI
    mode: exa
    url: https://ai.meta.com/blog/
    domain: ai.meta.com
    path_contains: /blog/

