  - name: Stripe Blog
    url: https://stripe.com/blog/feed.rss
  - name: Swiggy Bytes
    url: https://medium.com/feed/swiggy-bytes
  - name: Zepto Engineering
    url: https://blog.zeptonow.com/feed
  - name: Sakana AI
    url: https://sakana.ai/feed.xml
  - name: ClickHouse
    url: https://clickhouse.com/rss.xml
  - name: Fly.io
