# Feed URLs verified working as of 2026-10-17.
# Add/remove feeds and commit; next run picks it up.
# `pages` are blogs with no public feed. html is a plain GET of the index.
# firecrawl (Uber) and exa (Meta AI) run at most once per IST day.
feeds:
  # ---- Tech News
  - name: YC Hacker News
    url: https://news.ycombinator.com/rss
  - name: Technica
    url: https://feeds.arstechnica.com/arstechnica/index/
  # ---- Frontier labs & AI research
  - name: Google Research
    url: https://research.google/blog/rss/
  - name: Google DeepMind
    url: https://deepmind.google/blog/rss.xml
  - name: Microsoft Research
    url: https://www.microsoft.com/en-us/research/feed/
  - name: Apple ML Research
    url: https://machinelearning.apple.com/rss.xml
  - name: OpenAI News
    url: https://openai.com/news/rss.xml
  - name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
  - name: Together AI
